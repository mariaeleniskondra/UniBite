<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Το Προφίλ μου - UniBite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="unibite-nav">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div class="brand">🌮 UniBite</div>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn text-decoration-none">🛒 Θέλω να Φάω (Feed)</a>
            <a href="cook_dashboard.html" class="nav-btn text-decoration-none">👨‍🍳 Πίνακας Μάγειρα</a>
            <a href="add_listing.html" class="nav-btn text-decoration-none">+ Δώσε Φαγητό</a>
            <a href="profile.html" class="nav-btn active text-decoration-none">👤 Προφίλ</a>
            <a href="login.html" class="nav-btn text-decoration-none" onclick="localStorage.removeItem('token')">Αποσύνδεση</a>
        </div>
    </div>
</nav>

<div class="container main-area">

    <div class="profile-header-card mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <div class="bg-light rounded-circle d-flex justify-content-center align-items-center" style="width: 70px; height: 70px; font-size: 2rem; border: 2px solid var(--purple);">
                🎓
            </div>
            <div>
                <h3 class="fw-bold mb-1" style="color: var(--deep-purple);" id="profileUsername">Φόρτωση...</h3>
                <span class="badge" style="background: var(--light-purple); color: var(--deep-purple);">Ενεργός Φοιτητής</span>
            </div>
        </div>
        <div class="text-center bg-light p-3 rounded-4 border">
            <h6 class="text-muted mb-1 fw-bold">Διαθέσιμοι Πόντοι</h6>
            <h2 class="fw-bold mb-0" style="color: var(--purple);" id="profileCredits">- 🪙</h2>
        </div>
    </div>

    <h4 class="fw-bold mb-4 text-center" style="color: var(--deep-purple);">🍽️ Το Ιστορικό Κρατήσεών μου</h4>

    <div class="row g-4">
        <div class="col-12 col-lg-8 mx-auto" id="consumerRequestsContainer">
            <p class="text-center text-muted mt-4">Φόρτωση κρατήσεων...</p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="modal fade" id="ratingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: none;">
            <div class="modal-header bg-warning text-dark border-0 pb-3">
                <h5 class="modal-title fw-bold">Αξιολόγηση Γεύματος ⭐</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="ratingRequestId">

                <div class="mb-3">
                    <label class="form-label fw-bold">Βαθμολογία</label>
                    <select class="form-select" id="ratingValue">
                        <option value="5">5 - Εξαιρετικό! 😍</option>
                        <option value="4">4 - Πολύ καλό 😋</option>
                        <option value="3">3 - Καλό 😐</option>
                        <option value="2">2 - Μέτριο 😕</option>
                        <option value="1">1 - Κακό 🤢</option>
                    </select>
                    <small class="text-muted">Βαθμολογίες από 4 και πάνω δίνουν bonus πόντους στον μάγειρα!</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Σχόλια (Προαιρετικά)</label>
                    <textarea class="form-control" id="ratingComments" rows="3" placeholder="Γράψτε τη γνώμη σας για το φαγητό..."></textarea>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Ακύρωση</button>
                <button type="button" class="btn btn-warning fw-bold" onclick="submitRating()">Υποβολή Αξιολόγησης</button>
            </div>
        </div>
    </div>
</div>

<script src="js/profile.js"></script>
</body>
</html>
